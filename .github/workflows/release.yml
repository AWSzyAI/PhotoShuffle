name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Universal app
        run: zsh build.sh --universal
      - name: Package DMG
        run: zsh package-dmg.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoShuffle-DMG
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its reviewed assets."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --title "PhotoShuffle $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
